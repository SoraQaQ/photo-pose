<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>素材关键点提取</title></head><body><main style="font:16px/1.6 sans-serif;max-width:720px;margin:2rem auto;padding:1rem"><h1>授权素材关键点提取</h1><p>选择允许本地解析的图片；关键点仅在本机生成。请检查结果并填写由本地 Codex 生成、人工审核的描述。</p><label>图片 <input id="image" type="file" accept="image/*"></label><p><label>名称 <input id="name"></label> <label>场景 <select id="scene"><option value="park">公园</option><option value="street">街道</option><option value="indoor">室内</option></select></label></p><p><label>动作描述 <input id="description" size="40"></label></p><button id="extract">提取关键点</button> <span id="status"></span><p><canvas id="canvas" style="max-width:100%"></canvas></p><button id="save" disabled>下载 JSON</button><p>只导入已取得产品展示、模型解析和必要肖像许可的图片。</p></main><script type="module" src="/src/material.js"></script></body></html>
